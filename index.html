<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050508">
    <title>神話ソウル防衛（仮）</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #050508; overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #050508; outline: none; touch-action: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        color: #cfd3e0; font: 600 16px/1.4 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      #bar { width: 60vw; max-width: 260px; height: 8px; border-radius: 4px; background: #1c1e28; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #e0672b; transition: width 0.15s; }
      #error { display: none; color: #ff8a80; padding: 0 24px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <div>読み込み中…</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="error"></div>
    </div>
    <script>
      // 重さを測る：ゲームの1コマ（requestAnimationFrame の1回）の処理にかかった時間を数える。
      // ゲームの FPS 表示が読む（Assets/Plugins/WebGL/FrameStats.jslib）。
      (function () {
        var raf = window.requestAnimationFrame.bind(window);
        var stats = { busy: 0, frames: 0 };
        window.sdFrameStats = stats;
        window.requestAnimationFrame = function (callback) {
          return raf(function (time) {
            var start = performance.now();
            callback(time);
            stats.busy += performance.now() - start;
            stats.frames++;
          });
        };
      })();

      var canvas = document.getElementById("unity-canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("fill");

      // 縦画面（9:16）より横に広い画面（PC など）では、真ん中に 9:16 で表示する。
      // スマホのように縦に長い画面では、画面いっぱいに表示する。
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w / h > 9 / 16) w = Math.round(h * 9 / 16);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", fit);
      fit();
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      var instance = null;
      function pauseGame() {
        if (instance) instance.SendMessage("Game", "OnPageHidden");
      }
      // タブの切り替え・電話・ホームに戻る、などでページが見えなくなったら一時停止する
      document.addEventListener("visibilitychange", function () { if (document.hidden) pauseGame(); });
      window.addEventListener("pagehide", pauseGame);
      window.addEventListener("blur", pauseGame);

      var config = {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ayumu1111",
        productName: "神話ソウル防衛（仮）",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
        }).then(function (unityInstance) {
          instance = unityInstance;
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          var error = document.getElementById("error");
          error.style.display = "block";
          error.textContent = "読み込みに失敗しました：" + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
